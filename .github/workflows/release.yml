name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build package
        run: sh ./package-linux.sh --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: postui-linux-amd64
          path: dist/postui-linux-amd64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build package
        shell: pwsh
        run: .\package-windows.ps1 -OutputDir "$env:GITHUB_WORKSPACE\dist"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: postui-windows-amd64
          path: dist/postui-windows-amd64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: postui-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/postui-linux-amd64.tar.gz \
              dist/postui-windows-amd64.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/postui-linux-amd64.tar.gz \
              dist/postui-windows-amd64.zip \
              --title "PostUI $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
