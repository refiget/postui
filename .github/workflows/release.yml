name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to update, for example v0.1.0"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build package
        run: sh ./package-linux.sh --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: postui-linux-amd64
          path: dist/postui-linux-amd64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build package
        shell: pwsh
        run: .\package-windows.ps1 -OutputDir "$env:GITHUB_WORKSPACE\dist"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: postui-windows-amd64
          path: dist/postui-windows-amd64.zip
          if-no-files-found: error

  build-macos-intel:
    name: Build macOS Intel amd64
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Build package
        run: sh ./package-macos.sh --target x86_64-apple-darwin --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload macOS Intel package
        uses: actions/upload-artifact@v4
        with:
          name: postui-macos-amd64
          path: dist/postui-macos-amd64.tar.gz
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS Apple Silicon arm64
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Build package
        run: sh ./package-macos.sh --target aarch64-apple-darwin --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload macOS Apple Silicon package
        uses: actions/upload-artifact@v4
        with:
          name: postui-macos-arm64
          path: dist/postui-macos-arm64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs:
      - build-linux
      - build-windows
      - build-macos-intel
      - build-macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: postui-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/postui-linux-amd64.tar.gz \
              dist/postui-windows-amd64.zip \
              dist/postui-macos-amd64.tar.gz \
              dist/postui-macos-arm64.tar.gz \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/postui-linux-amd64.tar.gz \
              dist/postui-windows-amd64.zip \
              dist/postui-macos-amd64.tar.gz \
              dist/postui-macos-arm64.tar.gz \
              --title "PostUI $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
