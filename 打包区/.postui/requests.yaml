name: 文件审查服务
timeout_seconds: 30

# 上传文件放在发布目录的 files 子目录中；变量 review_file 填文件名或相对路径。
file_directory: "../files"

variables:
  - name: app_id
    default: "1003500007"
  - name: app_key
  - name: app_secret
  - name: agent_id
    default: "429203958470"
  - name: agreement_code
    default: "POSTUI-DOC-001"
  - name: attachment_id
    default: "postui-attachment-001"
  - name: review_file
  - name: stage_flag
    default: "1"
  - name: use_remote_rule_library
    default: "0"
  - name: task_id
  - name: file_id
  - name: task_status
  - name: module_status
  - name: callback_integrity
  - name: log_count
  - name: llm_prompt
    default: "请回复：文档审查服务连通"
  - name: llm_response
  - name: network_main_server
  - name: network_llm_server
  - name: log_limit
    default: "50"

requests:
  # 普通文档审查流程：上传文件 -> 受理任务 -> 查询状态和结果。
  - id: health
    name: 健康检查
    description: 检查服务、数据库和基础运行状态。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/health"

  - id: diagnostics
    name: 模块诊断
    description: 检查数据库、文件存储、本地规则库和 OCR 模块。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/diagnostics/modules"
    extract:
      module_status: data.status

  - id: upload-file
    name: 上传普通审核文件
    description: 从 files 目录上传文档，并提取返回的 fileId。
    request: |
      curl --location --request POST "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/files" \
        --form "file=@{{review_file}}"
    extract:
      file_id: data.fileId

  - id: accept-review
    name: 提交文档审查
    description: 使用上传接口返回的 file_id 创建普通文档审查任务。
    request: |
      curl --location --request POST "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/review" \
        --header "Content-Type: application/json" \
        --header "appId: {{app_id}}" \
        --header "appKey: {{app_key}}" \
        --header "appSecret: {{app_secret}}" \
        --data-raw '{
          "taskId": "{{task_id}}",
          "agreementCode": "{{agreement_code}}",
          "stageFlag": {{stage_flag}},
          "useRemoteRuleLibrary": {{use_remote_rule_library}},
          "agreementUrls": [
            {
              "attachmentId": "{{attachment_id}}",
              "fileId": "{{file_id}}"
            }
          ]
        }'
    extract:
      task_id: data.taskId

  - id: task-status
    name: 查询任务状态
    description: 查看任务状态、进度、文件状态和当前阶段。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/tasks/{{task_id}}"
    extract:
      task_status: data.status

  - id: review-result
    name: 查询审查结果
    description: 查看普通文档审查结果和问题明细。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/tasks/{{task_id}}/result"

  # README 中的排障接口。
  - id: task-timeline
    name: 下载任务时间线
    description: 查看任务状态、文件状态、执行阶段和最终问题的文本时间线。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/admin/tasks/{{task_id}}/timeline"

  - id: task-logs
    name: 查询任务执行日志
    description: 查看任务执行链中的受理、业务阶段、文件和错误记录。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/admin/tasks/{{task_id}}/task-logs"

  - id: callback-logs
    name: 查询回调日志
    description: 查看文件回调载荷、HTTP 状态、重试次数和响应内容。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/admin/tasks/{{task_id}}/callback-logs"

  - id: callback-integrity
    name: 检查回调完整性
    description: 检查终态文件是否存在成功回调以及重试编号是否连续。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/admin/tasks/{{task_id}}/callback-integrity"
    extract:
      callback_integrity: data.integrity

  - id: task-filtered-logs
    name: 查询任务运行日志
    description: 按 task_id 查询服务最近运行日志。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/logs?task_id={{task_id}}&limit={{log_limit}}"
    extract:
      log_count: data.count

  - id: recent-logs
    name: 查询最近运行日志
    description: 查看服务最近的运行日志，不限定任务。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/logs?limit={{log_limit}}"
    extract:
      log_count: data.count

  - id: download-logs
    name: 下载主运行日志
    description: 下载 logging.log_file_path 指定的主日志文件。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/logs/download"

  - id: llm-help
    name: LLM 测试说明
    description: 查看大模型连通性测试接口的请求格式和字段说明。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/llm/test"

  - id: llm-test
    name: 测试 LLM 连通性
    description: 向服务配置的大模型发送一条最小非流式测试消息。
    request: |
      curl --location --request POST "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/llm/test" \
        --header "Content-Type: application/json" \
        --header "appId: {{app_id}}" \
        --header "appKey: {{app_key}}" \
        --header "appSecret: {{app_secret}}" \
        --data-raw '{
          "agentId": "{{agent_id}}",
          "stream": false,
          "messages": [
            {
              "role": "user",
              "content": "{{llm_prompt}}"
            }
          ]
        }'
    extract:
      llm_response: data.response

  - id: network-config
    name: 查询网络配置
    description: 查看当前主服务和大模型服务地址。
    request: |
      curl --location "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/config/network"
    extract:
      network_main_server: data.main_server
      network_llm_server: data.llm_server

  - id: update-network-config
    name: 更新网络配置
    description: 修改主服务或大模型服务地址；发送前请确认变量内容。
    request: |
      curl --location --request POST "http://172.16.68.42/gmp/pms/info/hnlg/ai/api/config/network" \
        --header "Content-Type: application/json" \
        --data-raw '{
          "main_server": "{{network_main_server}}",
          "llm_server": "{{network_llm_server}}"
        }'
