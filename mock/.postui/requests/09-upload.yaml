name: 多文件上传
description: multipart 字段、两个文件和自定义文件名。
method: POST
url: http://{{host}}/v1/upload
form:
  - name: note
    value: "{{note}}"
  - name: user
    value: "{{user}}"
files:
  - field: file
    path: "{{upload_file}}"
    filename: "{{upload_filename}}"
    content_type: text/plain
  - field: second
    path: "{{second_upload_file}}"
    filename: null
    content_type: text/plain
extracts:
  - variable: upload_size
    path: data.files[0].size
