name: FastAPI mock 全场景
timeout: 1

directories:
  uploads: test_files
  downloads: temp

headers:
  - name: Accept
    value: application/json
  - name: X-PostUI-Collection
    value: "{{collection_name}}"

variables:
  collection_name: fastapi-mock
  token: mock-secret-token
  search_term: 文档审查 & edge
  page: "2"
  task_id: task-from-config
  item_id: item-42
  item_name: 文档接口测试
  item_value: value with spaces & symbols
  note: multipart note
  user: postui tester
  upload_file: sample.txt
  upload_filename: sample-upload.txt
  second_upload_file: second.txt
  missing_file: does-not-exist.txt
  session_id: session-001

environments:
  dev:
    variables:
      host: 127.0.0.1:18080
  test:
    variables:
      host: 127.0.0.1:18080

default_environment: test
