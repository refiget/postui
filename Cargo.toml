[package]
name = "postui"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Terminal client for sending configured HTTP requests"
license = "MIT"
readme = "README.md"
repository = "https://github.com/refiget/postui"

[lib]
name = "postui_core"
path = "src/lib.rs"

[[bin]]
name = "postui"
path = "src/main.rs"

[[example]]
name = "button_showcase"
path = "examples/ui-studies/button_showcase.rs"

[[example]]
name = "add_entry_gallery"
path = "examples/ui-studies/add_entry_gallery.rs"

[[example]]
name = "delete_icon_gallery"
path = "examples/ui-studies/delete_icon_gallery.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
bytes = "1.10"
cacache = { version = "13.1", default-features = false, features = ["async-std", "mmap"] }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.28"
directories = "6.0"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["deserialize", "serialize"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
form_urlencoded = "1.2"
memchr = "2.7"
quick-xml = "0.40"
unicode-segmentation = "1.13"
url = "2.5"
